name: CodeCritic Merge Gate
description: Run module-aware differential tests and fail on new regressions.
author: CodeCritic
branding:
  icon: git-pull-request
  color: blue

inputs:
  base:
    description: Base git ref or commit SHA.
    required: true
  head:
    description: Head git ref or commit SHA.
    required: false
    default: HEAD
  select:
    description: Test scope. Use modules for changed modules plus dependents, or all.
    required: false
    default: modules
  fail-on:
    description: Gate policy. new-failure, any-failure, high-risk, or never.
    required: false
    default: new-failure
  format:
    description: Report format. html or json.
    required: false
    default: json
  output:
    description: Report path, relative to the consumer workspace unless absolute. Defaults to codecritic-report.<format>.
    required: false
    default: ''
  sandbox-network:
    description: Docker sandbox network. Use bridge only when Maven/Gradle must download dependencies.
    required: false
    default: none
  test-timeout:
    description: Seconds allowed per test process.
    required: false
    default: "600"
  max-output-bytes:
    description: Captured stdout/stderr bytes per stream.
    required: false
    default: "200000"
  java-version:
    description: Java version used to build and run the verification CLI.
    required: false
    default: "21"

outputs:
  report:
    description: Absolute path to the generated report.
    value: ${{ steps.report_path.outputs.path }}

runs:
  using: composite
  steps:
    - id: report_path
      shell: bash
      run: |
        output="${{ inputs.output }}"
        if [ -z "$output" ]; then
          output="codecritic-report.${{ inputs.format }}"
        fi
        case "$output" in
          /*) ;;
          *) output="$GITHUB_WORKSPACE/$output" ;;
        esac
        echo "path=$output" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs['java-version'] }}
        cache: maven
        cache-dependency-path: ${{ github.action_path }}/pom.xml

    - name: Build CodeCritic CLI
      shell: bash
      working-directory: ${{ github.action_path }}
      run: mvn -B -ntp package -DskipTests

    - name: Run merge gate
      id: gate
      shell: bash
      env:
        CODECRITIC_SANDBOX_NETWORK: ${{ inputs['sandbox-network'] }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_SELECT: ${{ inputs.select }}
        INPUT_FAIL_ON: ${{ inputs['fail-on'] }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_TEST_TIMEOUT: ${{ inputs['test-timeout'] }}
        INPUT_MAX_OUTPUT_BYTES: ${{ inputs['max-output-bytes'] }}
        INPUT_REPORT: ${{ steps.report_path.outputs.path }}
      run: |
        java -jar "${{ github.action_path }}/target/codecritic.jar" \
          --repo "$GITHUB_WORKSPACE" \
          --base "$INPUT_BASE" \
          --head "$INPUT_HEAD" \
          --run-tests \
          --select "$INPUT_SELECT" \
          --fail-on "$INPUT_FAIL_ON" \
          --format "$INPUT_FORMAT" \
          --test-timeout "$INPUT_TEST_TIMEOUT" \
          --max-output-bytes "$INPUT_MAX_OUTPUT_BYTES" \
          --out "$INPUT_REPORT"
