name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java server (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: java-server
        run: mvn -B test

  python:
    name: Python agent (compile + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        working-directory: python-agent
        run: pip install -r requirements.txt
      - name: Compile check
        working-directory: python-agent
        run: python -m py_compile agent.py app.py groq_llm.py integration_test.py
