name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Build and test
    runs-on: ubuntu-latest
    # SecurityIntegrationTest is a true integration test: it registers a user through the
    # real filter chain and deletes it again via UserRepository, so it needs a live Mongo.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  verification-gate-e2e:
    name: Module-aware gate E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build verification CLI
        run: mvn -B -pl verification -am package -DskipTests
      - name: Run dependent-module regression gate
        env:
          CODECRITIC_SANDBOX_NETWORK: bridge
          CODECRITIC_E2E_REPORT: codecritic-e2e-report.json
        run: bash scripts/e2e-module-gate.sh
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecritic-e2e-report
          path: codecritic-e2e-report.json
          if-no-files-found: ignore
