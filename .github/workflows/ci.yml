name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: 'target/surefire-reports/'
          if-no-files-found: ignore

  verification-gate-e2e:
    name: Module-aware gate E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build CodeCritic CLI
        run: mvn -B package -DskipTests
      - name: Run dependent-module regression gate
        env:
          CODECRITIC_SANDBOX_NETWORK: bridge
          CODECRITIC_E2E_REPORT: codecritic-e2e-report.json
        run: bash scripts/e2e-module-gate.sh
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codecritic-e2e-report
          path: codecritic-e2e-report.json
          if-no-files-found: ignore
