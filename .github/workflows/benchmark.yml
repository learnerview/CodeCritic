name: Verification Gate Benchmark

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Git repository URL to benchmark.
        required: true
        default: https://github.com/OpenFeign/feign.git
      base:
        description: Base ref or commit SHA.
        required: true
        default: HEAD~1
      head:
        description: Head ref or commit SHA.
        required: true
        default: HEAD
      timeout:
        description: Seconds per test process.
        required: false
        default: "1200"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build verification CLI
        run: mvn -B -pl verification -am package -DskipTests
      - name: Benchmark full suite vs module-aware suite
        env:
          REPOSITORY: ${{ inputs.repository }}
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          CODECRITIC_SANDBOX_NETWORK: bridge
          CODECRITIC_BENCHMARK_TIMEOUT: ${{ inputs.timeout }}
        run: bash scripts/benchmark-module-gate.sh "$REPOSITORY" "$BASE" "$HEAD" | tee benchmark.md
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecritic-benchmark
          path: benchmark.md
          if-no-files-found: ignore
