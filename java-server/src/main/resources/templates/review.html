<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCritic - Snippet Review</title>
    <!-- CodeMirror Assets -->
    <link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.13/lib/codemirror.css">
    <link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.13/theme/dracula.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <main class="shell">
        <section class="hero">
            <p class="eyebrow">Snippet Review</p>
            <h1>Analyze Java snippets with full AI test generation.</h1>
            <p class="lede">Use this when you want fast review feedback before commit or PR.</p>
            <div class="actions">
                <a class="nav-link" href="/index.html">Home</a>
                <a class="nav-link" href="/repository.html">Repository Analysis</a>
                <a class="nav-link" href="/debug.html">Debug Assistant</a>
            </div>
            <div class="metrics">
                <div class="metric">
                    <span id="cyclomaticMetric">0</span>
                    <label>Cyclomatic</label>
                </div>
                <div class="metric">
                    <span id="cognitiveMetric">0</span>
                    <label>Cognitive</label>
                </div>
                <div class="metric">
                    <span id="bugMetric">0</span>
                    <label>Bugs</label>
                </div>
            </div>
        </section>
        <section class="panel">
            <div class="panel-header">
                <h2>Analyze Java</h2>
                <button id="analyzeBtn" class="ghost">Run Analysis</button>
            </div>
            <label class="field-label">Java Source</label>
            <div class="editor-container">
                <textarea id="codeInput" style="display: block;">public class Sample {
    public int divide(int a, int b) {
        return a / b;
    }
    public String getName(Object obj) {
        return obj.toString();
    }
}</textarea>
            </div>
            <div class="grid">
                <label>
                    Class Name
                    <input id="className" type="text" placeholder="Sample">
                </label>
                <label>
                    Method Name
                    <input id="methodName" type="text" placeholder="divide">
                </label>
                <label>
                    Parameters
                    <input id="parameters" type="text" placeholder="int a, int b">
                </label>
            </div>
            <div class="actions">
                <button data-action="complexity">Complexity</button>
                <button data-action="bugs">Find Bugs</button>
                <button data-action="test">Generate Test Template</button>
                <button data-action="full-test">Generate Full AI Tests</button>
            </div>
        </section>
        <section class="panel results">
            <div class="panel-header">
                <h2>Results</h2>
                <span id="statusText">Idle</span>
            </div>
            <pre id="output">Run an analysis to see results here.</pre>
        </section>
    </main>

    <!-- CodeMirror Scripts -->
    <script src="https://unpkg.com/codemirror@5.65.13/lib/codemirror.js"></script>
    <script src="https://unpkg.com/codemirror@5.65.13/mode/clike/clike.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
