server:
  port: ${PORT:8080}
  # Render free tier = 512 MB RAM: cap Tomcat threads so stack memory stays small.
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: 4

codecritic:
  auth:
    username: ${AUTH_USERNAME:admin}
    password: ${AUTH_PASSWORD:admin}
  jwt:
    secret: ${JWT_SECRET:codecritic-demo-secret-key-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: codecritic
  cors:
    allowed-origins: ${CORS_ALLOW_ORIGINS:*}

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/codecritic}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

# Redis is configured in code (RedisConfig) from REDIS_URL; fallback is
# redis://localhost:6379 for local development.
simplydone4j:
  enabled: ${SIMPLYDONE4J_ENABLED:true}
  key-prefix: codecritic
  ttl-days: 7
  idempotency-ttl-hours: 2
  scheduler:
    enabled: ${SIMPLYDONE4J_SCHEDULER_ENABLED:false}
    polling-interval-ms: 1000
    queue-prefix: "codecritic:queue"
    weights:
      high: 70
      normal: 20
      low: 10
  monitoring:
    enabled: ${SIMPLYDONE4J_MONITORING_ENABLED:false}
  rate-limit:
    requests-per-minute: 60
    window-seconds: 60
  retry:
    max-attempts: 3
    initial-delay-seconds: 5
    backoff-multiplier: 2.0
  worker:
    lease-timeout-seconds: 60
    retry-promoter-interval-ms: 5000
    lease-reaper-interval-ms: 10000
  queue:
    max-depth: ${SIMPLYDONE4J_QUEUE_MAX_DEPTH:5000}
  executor:
    core-pool-size: ${SIMPLYDONE4J_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${SIMPLYDONE4J_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${SIMPLYDONE4J_EXECUTOR_QUEUE_CAPACITY:50}
    keep-alive-seconds: 60
    default-timeout-seconds: 30

logging:
  level:
    com.codecritic: DEBUG