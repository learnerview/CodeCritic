services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 450mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - codecritic-net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - codecritic-net

  java-server:
    build:
      context: .
      dockerfile: java-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/codecritic
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-codecritic-demo-secret-key-change-me-in-production-0123456789}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - PYTHON_AGENT_URL=${PYTHON_AGENT_URL:-http://localhost:8000}
      - SIMPLYDONE4J_SCHEDULER_ENABLED=${SIMPLYDONE4J_SCHEDULER_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - codecritic-net

  python-agent:
    build: ./python-agent
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - JAVA_SERVER_URL=http://java-server:8080/api
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-1500000}
    ports:
      - "8000:8000"
    depends_on:
      - java-server
    networks:
      - codecritic-net

networks:
  codecritic-net:
    driver: bridge