version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - codecritic-net

  java-server:
    build:
      context: ..
      dockerfile: CodeCritic/java-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codecritic-net

  python-agent:
    build: ./python-agent
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_USE_LANGCHAIN=${GROQ_USE_LANGCHAIN:-true}
      - JAVA_SERVER_URL=http://java-server:8080/api
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-1500000}
    ports:
      - "8000:8000"
    depends_on:
      - java-server
    networks:
      - codecritic-net

networks:
  codecritic-net:
    driver: bridge